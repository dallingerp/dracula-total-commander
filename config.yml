config:
  lightTheme: alucard
  darkTheme: dracula
  stripes: true
fileColors: # list of file colors, order matters - first match will be used
  -
    mask: '>Directories'
    color: Cyan
    enabled: true

  - # Audio Files
    mask: "*.mp3;*.ogg;*.flac;*.wav;*.ape;*.wv;*.wma;*.mpc"
    color: Green
    enabled: true
  - # Tracker / Chiptune Modules
    mask: "*.mod;*.it;*.xm;*.stm;*.s3m"
    color: Green
    enabled: true
  - # Playlists & Cues
    mask: "*.m3u*;*.cue;*.plc;*.pls"
    color: Green
    enabled: true

  # Video & Media
  - # Video Files
    mask: "*.avi;*.mpg;*.mpeg;*.mpe;*.wmv;*.mp4;*.flv;*.mkv;*.webm;*.rm;*.asf;*.rmvb;*.3gp;*.ts;*.vob"
    color: Purple
    enabled: true
  - # Subtitles
    mask: "*.srt"
    color: Purple
    enabled: true

  # Images & Graphics
  - # Raster Images
    mask: "*.jpg;*.jpeg;*.jpe;*.png;*.bmp;*.gif;*.tif;*.tga;*.pcx;*.rgb;*.raw;*.dds"
    color: Pink
    enabled: true
  - # Vector & Project Files
    mask: "*.svg;*.ai;*.psd;*.pdn;*.xcf;*.ico;*.cur;*.ani"
    color: Pink
    enabled: true

  # 3D Models, CAD, Shaders & Materials
  - # 3D Models & CAD
    mask: "*.3ds;*.max;*.blend;*.scn;*.dae;*.x;*.mesh;*.x_t;*.mdl;*.dwg;*.dwt;*.dxf;*.sldprt"
    color: Pink
    enabled: false
  - # Shaders & Rendering
    mask: "*.fx;*.psh;*.vsh;*.hlsl;*.cg;*.glsl;*.shd;*.shader;*.frag;*.vert;*.program"
    color: Pink
    enabled: false
  - # Materials & Textures
    mask: "*.mat;*.material;*.mtl;*.clr;*.overlay"
    color: Pink
    enabled: false

  # Documents, Text & Publishing
  - # Plain Text & Markup
    mask: "*.txt;*.nfo;*.md;*.markdown;*.wiki"
    color: Yellow
    enabled: true
  - # Word Processing & PDF
    mask: "*.pdf;*.doc;*.rtf;*.odt"
    color: Yellow
    enabled: true
  - # Spreadsheets & Presentations
    mask: "*.xls;*.xlsx;*.xlsm;*.ods;*.ppt;*.pptx;*.pps"
    color: Yellow
    enabled: true
  - # Help Files & Documentation
    mask: "*.hlp;*.chm;*.chi;*.chq;*.chw;*.cnt;*.diz;*.dm2"
    color: Yellow
    enabled: true
  - # Ebooks
    mask: "*.epub;*.epub3;*.mobi;*.pdb"
    color: Yellow
    enabled: true


  # Source Code by Language
  - # C / C++
    mask: "*.c;*.cpp;*.cc;*.c++;*.h;*.hpp;*.inc;*.inl;*.tlh;*.cuh;*.cu"
    color: Orange
    enabled: true
  - # C# / .NET
    mask: "*.cs;*Designer.cs"
    color: Orange
    enabled: true
  - # Java
    mask: "*.java"
    color: Orange
    enabled: true
  - # Python & Ruby
    mask: "*.py;*.rb;*.j2"
    color: Orange
    enabled: true
  - # Delphi / Pascal
    mask: "*.pas;*.dpr;*.dcu;*.dfm;*.dof;*.dcr;*.dcp;*.bpl;*.dpk;*.bpk"
    color: Orange
    enabled: true
  - # Web Languages
    mask: "*.htm;*.html;*.shtml;*.mht;*.css;*.less;*.js;*.php;*.asp;*.aspx;*.ascx"
    color: Orange
    enabled: true
  - # Shell & Scripting
    mask: "*.bat;*.cmd;*.sh;*.bash;*.vbs;*.ps1"
    color: AnsiBrightGreen
    enabled: true
  - # Other
    mask: "*.sql;*.asm;*.lua"
    color: Orange
    enabled: true

  # Build Systems, Projects & Solutions
  - # Make & CMake
    mask: "*.make;*.mk;makefile*;cmakelists.txt;*.cmake"
    color: Orange
    enabled: true
  - # Visual Studio & IDE Projects
    mask: "*.sln;*.vcproj;*.vcxproj;*.csproj;*.dsp;*.dsw;*.cbp;*.bpr;*.stw;*.workspace;*.dev;*.code-workspace"
    color: AnsiBrightGreen
    enabled: true
  - # Resource & Definition Files
    mask: "*.rc;*.resx;*.resources;*.def;*.idl"
    color: Orange
    enabled: false

  # Executables, Libraries & Compiled Binaries
  - # Executables
    mask: "*.exe;*.com"
    color: AnsiBrightGreen
    enabled: true
  - # Drivers
    mask: "*.sys;*.drv;*.vxd;*.ocx;*.tlb;*.acm"
    color: AnsiBrightGreen
    enabled: false
  - # Static & Dynamic Libraries
    mask: "*.dll;*.lib;*.a;*.la;*.elf;*.ld"
    color: Orange
    enabled: true
  - # Compiled Objects & Intermediate Files
    mask: "*.obj;*.o;*.class;*.fpt;*.hex;*.eep;*.s19"
    color: Orange
    enabled: true

  # Configuration, Settings & Metadata
  - # Configuration Files
    mask: "*.ini;*.cfg;*.config;*.conf;*.set;*.settings;*.vssettings;*.scheme;*.properties"
    color: Pink
    enabled: true
  - # Data & Markup Languages
    mask: "*.xml;*.xsd;*.xdr;*.layout;*.kll;*.json;*.csv;*.yml;*.yaml"
    color: Orange
    enabled: true
  - # System & Registry
    mask: "*.reg;*.dat;*.lng;*.rgs;*.inf;*.isu;*.msc;*.manifest;*.desktop"
    color: Orange
    enabled: false

  # Archives & Disk Images
  - # Compressed Archives
    mask: "*.zip;*.rar;*.7z;*.tar;*.gz;*.tgz;*.bz2;*.cab;*.pak;*.ace;*.arj"
    color: Purple
    enabled: true
  - # Disk Images
    mask: "*.iso;*.nrg;*.img;*.bin"
    color: Purple
    enabled: true

  # Temp, Logs, Backup & Version Control
  - # Temporary & Cache Files
    mask: "*.tmp;*.bak;*.old;*.part;*.sta;*.in;*.out"
    color: Orange
    enabled: false
  - # Logs & Debug Data
    mask: "*.log;*.dmp;*.map;*.sym;*.err;*.trk;*.diff"
    color: Orange
    enabled: true
  - # IDE Database & State
    mask: "*.suo;*.user;*.idb;*.ncb;*.pch;*.ilk;*.sdf;*.exp;*.aps;*.sbr;*.linkinfo;*.vspscc;*.vssscc;*.filters;*.opensdf"
    color: Orange
    enabled: false
  - # System Metadata & Version Control
    mask: "descript.ion;thumbs.db;.svn;.git*;.hg*"
    color: Purple
    enabled: true

  # System Shortcuts, Fonts & Installer Packages
  - # Shortcuts & Connections
    mask: "*.lnk;*.url;*.rdp;*.cpl"
    color: AnsiBrightGreen
    enabled: true
  - # Fonts
    mask: "*.ttf;*.fnt;*.fon;*.font"
    color: Yellow
    enabled: false
  - # Installers
    mask: "*.msi;*.nsi;*.pif;*.uninstall"
    color: AnsiBrightGreen
    enabled: true
  - # Other / Misc Extensions
    mask: "*.bullet;*.dir;*.cf;*.cp;*.lst;*.lss;*.d;*.internal;*.bar;*.theme;*.scntoc;*.sav"
    color: Comment
    enabled: false

